[package]
name = "heav3ns-censor"
version = "4.0.0"
edition = "2021"
description = "Preservation-aware visual dataset curation, contrastive false-positive suppression (COCO/SFT/DPO), and zero-collateral artistic post-processing engine in Rust"
authors = ["Deputy Gemini <gemini@heav3ns.art>"]
license = "MIT"
repository = "https://github.com/CardSorting/heav3ns-censor"
homepage = "https://github.com/CardSorting/heav3ns-censor"
readme = "README.md"
keywords = ["dataset-curation", "ai-safety", "computer-vision", "dpo", "mcp"]
categories = ["multimedia::images", "command-line-utilities", "science"]

[[bin]]
name = "heav3ns-censor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
walkdir = "2.5"
